# Runs PHD1's safety tests on GitHub every time code is pushed.
# The tests use no AI and no internet, so no API keys are needed here.
name: safety tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
