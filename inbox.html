<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox · protected by PHD1</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #e3e5e9; --text: #1d2026;
    --muted: #6b7280; --select: #eef2ff; --accent: #4f46e5;
    --warn-bg: #fff4d6; --warn-text: #7a4b00; --warn-line: #f2c55c;
    --block-bg: #fdecec; --block-text: #9b1c1c; --ok: #157347;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .who { color: var(--muted); font-size: 13px; }
  .status { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--bg); color: var(--muted); transition: background .3s, color .3s; }
  .chip.on-warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-line); }
  .chip.on-block { background: var(--block-bg); color: var(--block-text); border-color: #f3b4b4; }
  .chip.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .checked { font-size: 12px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: minmax(300px, 38%) 1fr; min-height: 0; }
  #list { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
  .item { padding: 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: #f8f9fb; }
  .item.selected { background: var(--select); }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .from { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-block; margin-top: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px;
          background: var(--warn-bg); color: var(--warn-text); }
  #reader { overflow-y: auto; padding: 28px 36px; }
  #reader h2 { margin: 0 0 6px; font-size: 21px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .banner { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line);
            border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; animation: appear .4s ease-out; }
  .banner strong { display: block; margin-bottom: 2px; }
  @keyframes appear { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .body { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 18px 20px; }
  .link { color: var(--accent); text-decoration: underline; cursor: not-allowed; }
  .link.blocked { color: var(--block-text); text-decoration: line-through; background: var(--block-bg);
                  border-radius: 4px; padding: 0 4px; }
  .link.blocked::after { content: " blocked by PHD1"; text-decoration: none; display: inline-block;
                         font-size: 12px; margin-left: 4px; }
  .error { background: var(--block-bg); color: var(--block-text); padding: 8px 20px; font-size: 13px; }
  .empty { color: var(--muted); padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>Inbox</h1>
  <span class="who">pauline@example.ph</span>
  <div class="status">
    <span id="chip-banner" class="chip">Warning banners: off</span>
    <span id="chip-links" class="chip">External links: allowed</span>
    <span id="checked" class="checked"></span>
  </div>
</header>
<div id="error" class="error" hidden></div>
<main>
  <div id="list"></div>
  <div id="reader"><p class="empty">Select an email.</p></div>
</main>

<script>
// Email text comes from attackers, so it is only ever inserted as plain text
// (textContent), never as HTML. Links are shown, but never opened.
let state = null;
let selectedId = null;
let lastFlags = {};

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function bannerOn() { return state.flags.phishing_warning_banner; }
function linksBlocked() { return state.flags.block_external_links; }

function renderStatus() {
  const banner = document.getElementById("chip-banner");
  const links = document.getElementById("chip-links");
  banner.textContent = "Warning banners: " + (bannerOn() ? "ON" : "off");
  banner.classList.toggle("on-warn", bannerOn());
  links.textContent = "External links: " + (linksBlocked() ? "BLOCKED" : "allowed");
  links.classList.toggle("on-block", linksBlocked());
  // Flash a chip when its flag just changed, so the moment is easy to see on video.
  for (const [name, chip] of [["phishing_warning_banner", banner], ["block_external_links", links]]) {
    if (name in lastFlags && lastFlags[name] !== state.flags[name]) {
      chip.classList.remove("flash"); void chip.offsetWidth; chip.classList.add("flash");
    }
  }
  lastFlags = { ...state.flags };
  document.getElementById("checked").textContent =
    "checked " + new Date().toLocaleTimeString();
  const error = document.getElementById("error");
  error.hidden = !state.flags_error;
  error.textContent = state.flags_error ? "Couldn't reach Flagsmith: " + state.flags_error : "";
}

function renderList() {
  const list = document.getElementById("list");
  list.replaceChildren();
  for (const email of state.emails) {
    const item = el("div", "item" + (email.id === selectedId ? " selected" : ""));
    const top = el("div", "row");
    top.append(el("span", "from", email.from_name), el("span", "time", email.time));
    item.append(top, el("div", "subject", email.subject));
    if (bannerOn() && email.in_wave) item.append(el("span", "pill", "Suspicious"));
    item.onclick = () => { selectedId = email.id; render(); };
    list.append(item);
  }
}

function bodyWithLinks(email) {
  // Split the body around each link and rebuild it from text nodes and spans.
  const body = el("div", "body");
  let rest = email.body;
  for (const url of email.links) {
    const at = rest.indexOf(url);
    if (at === -1) continue;
    body.append(document.createTextNode(rest.slice(0, at)));
    const link = el("span", "link" + (linksBlocked() ? " blocked" : ""), url);
    link.title = linksBlocked() ? "Blocked by PHD1" : "Demo inbox: links are never opened";
    body.append(link);
    rest = rest.slice(at + url.length);
  }
  body.append(document.createTextNode(rest));
  return body;
}

function renderReader() {
  const reader = document.getElementById("reader");
  const email = state.emails.find(e => e.id === selectedId);
  if (!email) { reader.replaceChildren(el("p", "empty", "Select an email.")); return; }
  const parts = [el("h2", "", email.subject),
                 el("div", "meta", `${email.from_name} <${email.from_address}> · ${email.time}`)];
  if (bannerOn() && email.in_wave) {
    const banner = el("div", "banner");
    banner.append(el("strong", "", "Warning from PHD1: this looks like phishing"));
    banner.append(document.createTextNode(
      `This email pretends to be ${state.brand} but is not, and it is part of a phishing wave. ` +
      "Don't click its links or share your details. Open your bank's app directly instead."));
    parts.push(banner);
  }
  parts.push(bodyWithLinks(email));
  reader.replaceChildren(...parts);
}

function render() { renderStatus(); renderList(); renderReader(); }

async function refresh() {
  try {
    const response = await fetch("/api/state", { cache: "no-store" });
    state = await response.json();
    if (!selectedId && state.emails.length) selectedId = state.emails[0].id;
    render();
  } catch (e) {
    const error = document.getElementById("error");
    error.hidden = false;
    error.textContent = "Inbox server not reachable. Is python inbox.py still running?";
  }
}

refresh();
setInterval(refresh, 3000);   // check the flags every 3 seconds
</script>
</body>
</html>
